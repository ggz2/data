<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f4">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='10' fill='%23435c45'/%3E%3Cpath fill='white' d='M9 9h7v7H9zm11 0h7v7h-7zM9 20h7v7H9zm11 0h7v7h-7z'/%3E%3C/svg%3E">
  <title>Project Gallery</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20231f;
      --muted: #747970;
      --line: #e5e7e1;
      --paper: #fff;
      --canvas: #f7f7f4;
      --accent: #435c45;
      --accent-dark: #324834;
      --soft: #edf1e9;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 30px 0 64px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 76px;
      font-size: 14px;
      font-weight: 650;
      letter-spacing: -.02em;
    }

    .mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      background: var(--accent);
      color: white;
    }

    .mark svg { width: 18px; height: 18px; }

    .intro {
      max-width: 650px;
      margin-bottom: 34px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 6vw, 58px);
      font-weight: 570;
      letter-spacing: -.065em;
      line-height: 1.02;
    }

    .intro p:last-child {
      max-width: 480px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 18px;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      transition: background .15s ease, transform .15s ease;
    }

    button:hover { background: var(--accent-dark); }
    button:active { transform: translateY(1px); }
    button:disabled { cursor: wait; opacity: .72; }
    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 3px solid #9db49e;
      outline-offset: 3px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 50px 0 18px;
    }

    .result-title {
      margin: 0;
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -.03em;
    }

    .result-count {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .folder-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 18px;
    }

    .folder-tabs button {
      min-height: 35px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .folder-tabs button:hover {
      border-color: #c8d1c4;
      background: var(--soft);
      color: var(--ink);
    }

    .folder-tabs button[aria-selected="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .notice {
      display: none;
      max-width: 720px;
      margin-top: 18px;
      padding: 13px 15px;
      border: 1px solid #e6d7b6;
      border-radius: 11px;
      background: #fffaf0;
      color: #67552d;
      font-size: 13px;
      line-height: 1.55;
    }

    .notice.visible { display: block; }
    .notice.error { border-color: #ecd0cc; background: #fff6f4; color: #82443a; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: 0 5px 20px rgb(28 38 28 / 3%);
    }

    .preview {
      display: grid;
      height: 230px;
      place-items: center;
      overflow: hidden;
      background:
        linear-gradient(45deg, #f0f1ec 25%, transparent 25%),
        linear-gradient(-45deg, #f0f1ec 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f0f1ec 75%),
        linear-gradient(-45deg, transparent 75%, #f0f1ec 75%);
      background-color: #f8f9f6;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-size: 16px 16px;
    }

    .preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .image-fallback {
      display: none;
      padding: 20px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .card-info { padding: 15px 16px 16px; }

    .file-path {
      overflow: hidden;
      margin: 0;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      display: none;
      margin-top: 20px;
      padding: 38px 20px;
      border: 1px dashed #d9ddd5;
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .empty.visible { display: block; }

    footer {
      margin-top: 54px;
      color: #8a8f87;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 820px) {
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      header { margin-bottom: 58px; }
    }

    @media (max-width: 560px) {
      .shell { width: min(100% - 28px, 480px); padding-top: 20px; }
      header { margin-bottom: 49px; }
      .gallery { grid-template-columns: 1fr; gap: 13px; }
      .preview { height: 250px; }
      .toolbar { margin-top: 38px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="8" height="8" rx="2" fill="currentColor"/>
          <rect x="13" y="3" width="8" height="8" rx="2" fill="currentColor" opacity=".65"/>
          <rect x="3" y="13" width="8" height="8" rx="2" fill="currentColor" opacity=".65"/>
          <rect x="13" y="13" width="8" height="8" rx="2" fill="currentColor"/>
        </svg>
      </span>
      Project Gallery
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">A little window into your project</p>
      <h1 id="page-title">Your images,<br>all in one place.</h1>
      <p>Browse image files from across the project. Choose a folder tab to narrow the gallery.</p>
    </section>

    <div class="notice" id="notice" role="status" aria-live="polite"></div>

    <section class="toolbar" aria-label="Gallery controls">
      <div>
        <h2 class="result-title">Project images</h2>
        <span class="result-count" id="result-count">Scanning project folders…</span>
      </div>
      <button id="refresh-button" type="button">Refresh</button>
    </section>

    <nav class="folder-tabs" id="folder-tabs" aria-label="Filter images by folder"></nav>
    <section class="gallery" id="gallery" aria-label="Project images"></section>
    <div class="empty visible" id="empty" role="status">Scanning project folders…</div>

    <footer>Showing images found in the project folders.</footer>
  </main>

  <script>
  const notice = document.querySelector("#notice");
  const resultCount = document.querySelector("#result-count");
  const refreshButton = document.querySelector("#refresh-button");
  const folderTabs = document.querySelector("#folder-tabs");
  const gallery = document.querySelector("#gallery");
  const empty = document.querySelector("#empty");

  let currentImages = [];
  let activeFolder = "all";

  const imageExtensions = new Set([
    "apng", "avif", "bmp", "gif", "ico",
    "jpeg", "jpg", "png", "svg", "tif",
    "tiff", "webp"
  ]);

  // Directories to search, relative to the website root.
  const searchDirectories = [
    ".",
    "images/",
    "assets/",
    "projects/",
    "public/"
  ];

  function isImage(path) {
    return imageExtensions.has(
      path.split("?")[0].split(".").pop().toLowerCase()
    );
  }

  async function scanDirectory(directory, visited = new Set()) {
    const url = new URL(directory, window.location.origin);

    if (visited.has(url.href)) return [];
    visited.add(url.href);

    try {
      const response = await fetch(url.href);

      if (!response.ok) return [];

      const html = await response.text();
      const doc = new DOMParser().parseFromString(html, "text/html");

      const images = [];

      // Find image links.
      for (const link of doc.querySelectorAll("a[href]")) {
        const href = link.getAttribute("href");
        if (!href || href.startsWith("?") || href.startsWith("#")) continue;

        const fileUrl = new URL(href, url);

        if (fileUrl.origin !== location.origin) continue;

        if (isImage(fileUrl.pathname)) {
          images.push(fileUrl.pathname);
        } else if (
          href.endsWith("/") &&
          fileUrl.pathname !== url.pathname
        ) {
          images.push(...await scanDirectory(fileUrl.pathname, visited));
        }
      }

      return images;
    } catch {
      return [];
    }
  }

  function folderFor(path) {
    const parts = path.split("/");
    parts.pop();
    return parts.join("/") || "Project root";
  }

  function makeCard(path) {
    const card = document.createElement("article");
    card.className = "card";

    const preview = document.createElement("div");
    preview.className = "preview";

    const img = document.createElement("img");
    img.src = path;
    img.alt = `Image in ${folderFor(path)}`;
    img.loading = "lazy";

    const fallback = document.createElement("span");
    fallback.className = "image-fallback";
    fallback.textContent = "This image could not be previewed.";

    img.onerror = () => {
      img.style.display = "none";
      fallback.style.display = "block";
    };

    preview.append(img, fallback);

    const info = document.createElement("div");
    info.className = "card-info";

    const directory = document.createElement("p");
    directory.className = "file-path";
    directory.textContent = folderFor(path);

    info.append(directory);
    card.append(preview, info);

    return card;
  }

  function renderImages() {
    const images = activeFolder === "all"
      ? currentImages
      : currentImages.filter(path =>
          activeFolder === "Project root"
            ? !path.substring(1).includes("/")
            : folderFor(path) === activeFolder
        );

    gallery.replaceChildren(...images.map(makeCard));

    resultCount.textContent =
      `${images.length} ${images.length === 1 ? "image" : "images"}`;

    empty.classList.toggle("visible", images.length === 0);
    empty.textContent = currentImages.length
      ? "There are no images in this folder."
      : "No images were found.";
  }

  function renderTabs() {
    folderTabs.replaceChildren();

    const folders = [
      ...new Set(currentImages.map(folderFor))
    ].sort();

    const options = ["all", ...folders];

    for (const folder of options) {
      const button = document.createElement("button");
      button.textContent = folder === "all" ? "All images" : folder;

      button.setAttribute(
        "aria-selected",
        String(activeFolder === folder)
      );

      button.onclick = () => {
        activeFolder = folder;
        renderTabs();
        renderImages();
      };

      folderTabs.append(button);
    }
  }

  async function scanProject() {
    refreshButton.disabled = true;
    refreshButton.textContent = "Scanning…";

    resultCount.textContent = "Searching folders…";
    gallery.replaceChildren();
    empty.classList.add("visible");
    empty.textContent = "Searching project folders…";

    try {
      const visited = new Set();

      const results = await Promise.all(
        searchDirectories.map(directory =>
          scanDirectory(directory, visited)
        )
      );

      currentImages = [
        ...new Set(results.flat())
      ].sort();

      activeFolder = "all";

      renderTabs();
      renderImages();

      notice.classList.remove("visible");
    } catch (error) {
      notice.textContent = "Could not scan the project.";
      notice.classList.add("visible", "error");
    } finally {
      refreshButton.disabled = false;
      refreshButton.textContent = "Refresh";
    }
  }

  refreshButton.addEventListener("click", scanProject);
  scanProject();
  </script>
</body>
</html>
